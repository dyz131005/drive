<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awnidnrdooiwds 网盘</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #7c3aed;
            --accent: #f59e0b;
            --accent-light: #fbbf24;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --success: #10b981;
            --dark: #111827;
            --light: #f9fafb;
            --gray: #6b7280;
            --gray-light: #e5e7eb;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.12);
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--dark);
            background-color: var(--light);
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            transition: var(--transition);
        }

        header.scrolled {
            padding: 12px 0;
            box-shadow: var(--shadow);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            transition: var(--transition);
        }

        .logo-icon:hover {
            transform: scale(1.05);
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-links a, .nav-links button {
            color: var(--dark);
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: var(--transition);
            padding: 5px 0;
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .nav-links a:hover, .nav-links button:hover {
            color: var(--primary);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .user-name {
            font-weight: 500;
            color: var(--dark);
        }

        .logout-btn {
            padding: 8px 15px;
            background-color: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background-color: var(--danger-dark);
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            color: var(--dark);
            cursor: pointer;
        }

        .drive-header {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 100px;
            position: relative;
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
        }

        .drive-content {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .drive-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .drive-title h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .drive-title p {
            font-size: 1.2rem;
            color: var(--gray);
        }

        .upload-zone {
            background: white;
            border-radius: var(--radius);
            padding: 60px;
            box-shadow: var(--shadow);
            text-align: center;
            border: 2px dashed var(--gray-light);
            transition: var(--transition);
            margin-bottom: 30px;
        }

        .upload-zone:hover {
            border-color: var(--primary);
        }

        .upload-zone.dragover {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        .upload-icon {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2rem;
            color: var(--gray);
            margin-bottom: 20px;
        }

        .upload-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: var(--primary);
            color: white;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .upload-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .upload-progress {
            display: none;
            margin-top: 20px;
            text-align: left;
            background: var(--light);
            border-radius: 8px;
            padding: 15px 20px;
            border: 1px solid var(--gray-light);
        }

        .upload-progress .progress-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--dark);
            margin-bottom: 8px;
            word-break: break-all;
        }

        .upload-progress .progress-track {
            width: 100%;
            height: 18px;
            background: #e5e7eb;
            border-radius: 9px;
            overflow: hidden;
        }

        .upload-progress .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 9px;
            transition: width 0.3s ease;
        }

        .upload-progress .progress-text {
            font-size: 0.85rem;
            color: var(--gray);
            margin-top: 6px;
        }

        .file-input {
            display: none;
        }

        .file-list {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .file-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .file-list-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .file-count {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .refresh-btn i {
            font-size: 0.9rem;
        }

        .refresh-btn.loading i {
            animation: spin 1s linear infinite;
        }

        .file-list-content {
            max-height: 400px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 15px 30px;
            border-bottom: 1px solid var(--gray-light);
            transition: var(--transition);
        }

        .file-item:hover {
            background: var(--light);
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            margin-right: 15px;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 3px;
        }

        .file-meta {
            font-size: 0.85rem;
            color: var(--gray);
        }

        .file-actions {
            display: flex;
            gap: 10px;
        }

        .file-action-btn {
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-size: 0.9rem;
        }

        .download-btn {
            background-color: var(--success);
            color: white;
        }

        .download-btn:hover {
            background-color: #059669;
        }

        .delete-btn {
            background-color: var(--danger);
            color: white;
        }

        .delete-btn:hover {
            background-color: var(--danger-dark);
        }

        .empty-state {
            padding: 60px 30px;
            text-align: center;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        .login-prompt {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 80px;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .login-prompt i {
            font-size: 5rem;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .login-prompt h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--dark);
        }

        .login-prompt p {
            color: var(--gray);
            margin-bottom: 30px;
        }

        .login-prompt-btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: var(--primary);
            color: white;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }

        .login-prompt-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        footer {
            background-color: var(--dark);
            color: var(--light);
            padding: 60px 0 30px;
        }

        .footer-content {
            text-align: center;
            margin-bottom: 40px;
        }

        .footer-logo {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
        }

        .copyright {
            font-size: 1rem;
            color: #9ca3af;
            margin-bottom: 15px;
        }

        .credit {
            color: #9ca3af;
            margin-bottom: 15px;
        }

        .icp-link {
            color: #9ca3af;
            text-decoration: none;
            transition: var(--transition);
        }

        .icp-link:hover {
            color: var(--accent);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius);
            padding: 40px;
            max-width: 450px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            position: relative;
            animation: fadeInUp 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-header h2 {
            font-size: 1.8rem;
            color: var(--dark);
        }

        .modal-close {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--gray-light);
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            color: var(--dark);
        }

        .modal-close:hover {
            background: var(--gray);
            color: white;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--light);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            color: var(--gray);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--gray-light);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: var(--primary);
            color: white;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .feedback-status {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
        }

        .feedback-status.success {
            display: block;
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .feedback-status.error {
            display: block;
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .feedback-status.info {
            display: block;
            background-color: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background-color: var(--gray-light);
            color: var(--dark);
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            margin-bottom: 30px;
        }

        .back-link:hover {
            background-color: var(--gray);
            color: white;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .nav-links {
                position: fixed;
                top: 80px;
                left: 0;
                width: 100%;
                background: white;
                flex-direction: column;
                align-items: center;
                padding: 20px 0;
                transform: translateY(-100%);
                opacity: 0;
                visibility: hidden;
                transition: all 0.3s ease;
                box-shadow: var(--shadow);
                gap: 0;
            }

            .nav-links.active {
                transform: translateY(0);
                opacity: 1;
                visibility: visible;
            }

            .nav-links li {
                margin: 15px 0;
            }

            .drive-title h1 {
                font-size: 2.2rem;
            }

            .upload-zone {
                padding: 40px 20px;
            }

            .file-item {
                padding: 12px 15px;
            }

            .file-actions {
                flex-direction: column;
                gap: 5px;
            }

            .login-prompt {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <header id="header">
        <div class="container">
            <nav>
                <a href="../index.html" class="logo-container">
                    <div class="logo-icon">
                        <i class="fas fa-cloud"></i>
                    </div>
                    <span class="logo-text">Drive</span>
                </a>
                <ul class="nav-links" id="navLinks">
                    <li><a href="../index.html"><i class="fas fa-home"></i> 返回主页</a></li>
                    <li id="authNavItem"></li>
                </ul>
                <div class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="drive-header">
            <div class="container">
                <div class="drive-content">
                    <a href="../index.html" class="back-link">
                        <i class="fas fa-arrow-left"></i> 返回主页
                    </a>
                    <div class="drive-title">
                        <h1><i class="fas fa-cloud"></i> Awnidnrdooiwds 网盘</h1>
                        <p>安全、便捷的文件存储与分享</p>
                    </div>

                    <div id="loginPrompt" class="login-prompt" style="display: none;">
                        <i class="fas fa-user-lock"></i>
                        <h2>需要登录</h2>
                        <p>请先登录您的账户才能使用网盘功能</p>
                        <button class="login-prompt-btn" onclick="openAuthModal()">登录 / 注册</button>
                    </div>

                    <div id="driveMain" style="display: none;">
                        <div class="upload-zone" id="uploadZone">
                            <i class="fas fa-cloud-upload-alt upload-icon"></i>
                            <p class="upload-text">拖拽文件到此处，或点击下方按钮选择文件</p>
                            <div class="feedback-status" id="uploadStatus"></div>
                            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                                <i class="fas fa-plus"></i> 选择文件
                            </button>
                            <input type="file" id="fileInput" class="file-input" multiple>
                            <div class="upload-progress" id="uploadProgressWrap">
                                <div class="progress-name" id="uploadProgressName"></div>
                                <div class="progress-track">
                                    <div class="progress-fill" id="uploadProgressBar"></div>
                                </div>
                                <div class="progress-text" id="uploadProgressText"></div>
                            </div>
                        </div>

                        <div class="file-list">
                            <div class="file-list-header">
                                <span class="file-list-title"><i class="fas fa-folder-open"></i> 我的文件</span>
                                <div style="display: flex; align-items: center; gap: 15px;">
                                    <span class="file-count" id="fileCount">0 个文件</span>
                                    <button class="refresh-btn" id="refreshBtn" onclick="handleRefresh()">
                                        <i class="fas fa-sync-alt"></i> 刷新
                                    </button>
                                </div>
                            </div>
                            <div class="file-list-content" id="fileListContent">
                                <div class="empty-state">
                                    <i class="fas fa-folder-open"></i>
                                    <p>暂无文件，上传一些文件开始使用</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">Awnidnrdooiwds</div>
                <p class="copyright">dyz版权所有 © 2023 Awnidnrdooiwds个人聚合站</p>
                <p class="credit">本网站由 <strong>deepseek</strong> 编写</p>
                <p><a href="https://icp.gov.moe/?keyword=20269997" target="_blank" class="icp-link">萌ICP备20269997号</a></p>
            </div>
        </div>
    </footer>

    <div class="modal" id="authModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>账户</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="login">登录</button>
                <button class="tab-btn" data-tab="register">注册</button>
            </div>
            <div class="tab-content active" id="loginTab">
                <div class="feedback-status" id="loginStatus"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginUsername">用户名</label>
                        <input type="text" id="loginUsername" class="form-control" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">密码</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">登录</button>
                </form>
            </div>
            <div class="tab-content" id="registerTab">
                <div class="feedback-status" id="registerStatus"></div>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regUsername">用户名</label>
                        <input type="text" id="regUsername" class="form-control" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="regName">显示姓名</label>
                        <input type="text" id="regName" class="form-control" placeholder="请输入显示姓名" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">邮箱</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="请输入邮箱" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">密码</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">注册</button>
                </form>
            </div>
        </div>

    <script>

        async function fetchYamlFile(filename, repo = GITHUB_REPO) {
            const apiKey = decodeApiKey();
            if (!apiKey) throw new Error("API Key解码失败");

            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${repo}/contents/${filename}`;
            console.log(`获取文件: ${url}`);

            const response = await fetch(url, {
                headers: {
                    'Authorization': `token ${apiKey}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            console.log(`响应状态: ${response.status}`);

            if (response.status === 404) {
                console.log('文件不存在，返回null');
                return null;
            }
            if (!response.ok) {
                const errorText = await response.text();
                console.error(`获取${filename}失败: ${response.status}`, errorText);
                throw new Error(`获取${filename}失败: ${response.status}`);
            }

            // GitHub 对部分文件会直接返回 raw 文本（Content-Type: vnd.github.v3.raw），需双形态兼容
            const contentType = response.headers.get('content-type') || '';
            if (contentType.includes('raw')) {
                const rawText = await response.text();
                console.log('GitHub直接返回raw文本，长度:', rawText.length);
                return rawText;
            }

            const data = await response.json();
            console.log('响应数据类型:', data.type, '编码:', data.encoding);
            
            if (data.encoding === 'base64' && data.content) {
                const binary = atob(data.content.replace(/\n/g, ''));
                const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
                const decoded = new TextDecoder().decode(bytes);
                console.log('成功解码base64内容，长度:', decoded.length);
                return decoded;
            }
            
            if (data.download_url) {
                console.log('使用download_url获取内容');
                const rawResponse = await fetch(data.download_url, {
                    headers: {
                        'Authorization': `token ${apiKey}`
                    }

                if (rawResponse.ok) {
                    const text = await rawResponse.text();
                    console.log('成功获取原始内容，长度:', text.length);
                    return text;
                }
            }
            
            throw new Error(`无法解析${filename}的内容`);
        }

        // 用于把字符串安全地嵌入 onclick 单引号属性
        function jsString(value) {
            return String(value)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n');
        }

        // 根据文件条目重建服务器上的存储文件名（旧数据没有 storedChunks 时使用）
        function buildChunkStoredName(fileInfo, chunkIndex) {
            const baseName = (fileInfo.fileName || '').replace(/\.[^/.]+$/, '');
            if ((fileInfo.totalChunks || 1) === 1) {
                return `v${fileInfo.version}_${baseName}.bin`;
            }
            return `v${fileInfo.version}_${baseName}_chunk${chunkIndex}.bin`;
        }

        // 计算 git blob SHA（GitHub contents API 返回的 sha 即该值）
        async function computeGitBlobSha(buffer) {
            const bytes = new Uint8Array(buffer);
            const header = new TextEncoder().encode(`blob ${bytes.length}\0`);
            const combined = new Uint8Array(header.length + bytes.length);
            combined.set(header, 0);
            combined.set(bytes, header.length);
            const digest = await crypto.subtle.digest('SHA-1', combined);
            return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // 真实请求服务器验证文件确实存在且内容完整；通过返回 true，否则抛错
        async function verifyChunkOnServer(storedName, expectedSize, expectedBuffer) {
            const apiKey = decodeApiKey();
            if (!apiKey) throw new Error("API Key解码失败");

            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/files/${encodeURIComponent(storedName)}`;

            const response = await fetch(url, {
                headers: {
                    'Authorization': `token ${apiKey}`,
                    'Accept': 'application/vnd.github.v3+json'
                },
                cache: 'no-store'
            });

            if (!response.ok) throw new Error(`验证失败: 服务器返回状态码 ${response.status}`);

            const data = await response.json();
            if (data.type !== 'file') throw new Error(`验证失败: 服务器上未找到文件 ${storedName}`);
            if (data.size !== expectedSize) {
                throw new Error(`验证失败: 文件大小不符（服务器 ${data.size} 字节 / 本地 ${expectedSize} 字节）`);
            }

            if (typeof crypto !== 'undefined' && crypto.subtle) {
                try {
                    const expectedSha = await computeGitBlobSha(expectedBuffer);
                    if (expectedSha !== data.sha) {
                        throw new Error('验证失败: 内容校验和不符，服务器可能未完整写入');
                    }
                } catch (e) {
                    if (e instanceof Error && e.message && e.message.indexOf('验证失败') === 0) throw e;
                    // 计算校验和不可用（如非安全上下文）时，仅依赖存在性 + 大小校验
                }
            }

            return true;
        }

        function base64Encode(str) {
            const bytes = new TextEncoder().encode(str);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        async function saveFilesList(filesArray) {
            const apiKey = decodeApiKey();
            if (!apiKey) throw new Error("API Key解码失败");

            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/files.yaml`;

            let sha = null;
            let attempts = 0;
            const maxAttempts = 3;
            let lastError = null;

            while (attempts < maxAttempts) {
                attempts++;
                try {
                    const existingResponse = await fetch(url, {
                        headers: {
                            'Authorization': `token ${apiKey}`,
                            'Accept': 'application/vnd.github.v3+json'
                        },
                        cache: 'no-store'
                    });

                    console.log(`第 ${attempts} 次尝试获取文件信息，状态码: ${existingResponse.status}`);

                    if (existingResponse.ok || existingResponse.status === 304) {
                        const data = await existingResponse.json();
                        if (data && data.sha) {
                            sha = data.sha;
                            console.log("获取到sha:", sha);
                            break;
                        } else {
                            console.log("响应数据中没有sha字段:", data);
                        }
                    } else if (existingResponse.status === 404) {
                        console.log("文件不存在，将创建新文件");
                        break;
                    } else {
                        const errorText = await existingResponse.text();
                        lastError = new Error(`获取文件信息失败: ${existingResponse.status} - ${errorText.substring(0, 100)}`);
                        console.error(lastError.message);
                    }
                } catch (e) {
                    lastError = e;
                    console.error("获取文件信息时发生异常:", e.message);
                }
                
                if (attempts < maxAttempts) {
                    console.log(`等待 1 秒后重试...`);
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
            }

            if (!sha && attempts >= maxAttempts && lastError) {
                throw lastError;
            }

            const content = jsyaml.dump({ files: filesArray || [] });
            const base64Content = base64Encode(content);

            const requestBody = {
                message: "更新文件列表",
                content: base64Content
            };

                    'Content-Type': 'application/json'

                body: JSON.stringify(requestBody)

                const errorText = await response.text();
                throw new Error(`保存文件列表失败: ${response.status} - ${errorText.substring(0, 200)}`);
            }
            return await response.json();
        }

        function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            const chunkSize = 8192;
            
            for (let i = 0; i < bytes.length; i += chunkSize) {
                const end = Math.min(i + chunkSize, bytes.length);
                const chunk = bytes.subarray(i, end);
                for (let j = 0; j < chunk.length; j++) {
                    binary += String.fromCharCode(chunk[j]);
                }
            }
            
            return btoa(binary);
        }
        const MAX_FILE_SIZE = 1024 * 1024 * 1024;
        const CHUNK_SIZE = 25 * 1024 * 1024;
        const DAILY_UPLOAD_LIMIT = 30;

        async function uploadChunkToRepo(chunkData, version, fileName, chunkIndex, totalChunks) {
            const apiKey = decodeApiKey();
            if (!apiKey) throw new Error("API Key解码失败");

            const baseName = fileName.replace(/\.[^/.]+$/, '');
            const extName = fileName.split('.').pop() || 'bin';
            const chunkFileName = `v${version}_${baseName}_chunk${chunkIndex}.bin`;
            const filePath = `files/${encodeURIComponent(chunkFileName)}`;
            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${filePath}`;

            const base64Content = arrayBufferToBase64(chunkData);

            let sha = null;
            try {
                const existingResponse = await fetch(url, {
                    headers: {
                        'Authorization': `token ${apiKey}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                if (existingResponse.ok) {
                    const data = await existingResponse.json();
                    sha = data.sha;
                }
            } catch (e) {}

            const requestBody = {
                message: `上传文件分片: ${chunkFileName} (${chunkIndex + 1}/${totalChunks})`,
                content: base64Content
            };
            if (sha) requestBody.sha = sha;

            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`上传分片失败: ${response.status} - ${errorText}`);
            }

            return await response.json();
        }

        async function uploadFileInChunks(file, version, onPhase) {
            const apiKey = decodeApiKey();
            if (!apiKey) throw new Error("API Key解码失败");

            const arrayBuffer = await file.arrayBuffer();
            const totalChunks = Math.ceil(arrayBuffer.byteLength / CHUNK_SIZE);
            const fileInfo = {
                originalName: file.name,
                size: file.size,
                totalChunks: totalChunks,
                chunkSize: CHUNK_SIZE,
                uploadedAt: new Date().toISOString()
            };

            const baseName = file.name.replace(/\.[^/.]+$/, '');
            const storedNames = [];
            const uploadedChunks = [];

            for (let i = 0; i < totalChunks; i++) {
                const start = i * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, arrayBuffer.byteLength);
                const chunkData = arrayBuffer.slice(start, end);
                const chunkFileName = `v${version}_${baseName}_chunk${i}.bin`;
                storedNames.push(chunkFileName);
                uploadedChunks.push(chunkData);
                await uploadChunkToRepo(chunkData, version, baseName, i, totalChunks);
                if (onPhase) onPhase({ type: 'transfer', bytes: chunkData.byteLength });
            }

            if (onPhase) onPhase({ type: 'verify' });
            for (let i = 0; i < totalChunks; i++) {
                await verifyChunkOnServer(storedNames[i], uploadedChunks[i].byteLength, uploadedChunks[i]);
            }
            if (onPhase) onPhase({ type: 'verified', bytes: file.size });

            fileInfo.storedChunks = storedNames;
            return fileInfo;
        }

        async function downloadChunk(storedName) {
            const apiKey = decodeApiKey();
            if (!apiKey) throw new Error("API Key解码失败");

            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/files/${encodeURIComponent(storedName)}`;

            const infoResponse = await fetch(apiUrl, {
                headers: {
                    'Authorization': `token ${apiKey}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (!infoResponse.ok) {
                throw new Error(`获取文件信息失败: ${infoResponse.status}`);
            }

            const fileInfo = await infoResponse.json();

            if (fileInfo.type !== 'file') {
                throw new Error('服务器返回的不是文件');
            }

            // 0字节空文件：直接返回空缓冲（GitHub 的 raw 请求对空文件会返回 JSON 元数据）
            if (fileInfo.size === 0) {
                return new ArrayBuffer(0);
            }

            // 小文件：解码 base64 content
            if (fileInfo.content) {
                const binaryString = atob(fileInfo.content.replace(/\n/g, ''));
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return bytes.buffer;
            }

            // 大文件：contents API 的 raw 对 >1MB 文件会返回 JSON 元数据，改用 git blobs API 的 raw 媒体类型拉取
            if (!fileInfo.sha) {
                throw new Error('无法获取文件的 blob SHA');
            }

            const blobUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/git/blobs/${fileInfo.sha}`;
            const blobResponse = await fetch(blobUrl, {
                headers: {
                    'Authorization': `token ${apiKey}`,
                    'Accept': 'application/vnd.github.v3.raw'
                }
            });

            if (!blobResponse.ok) {
                throw new Error(`下载文件失败: ${blobResponse.status}`);
            }

            const contentType = blobResponse.headers.get('content-type') || '';
            if (contentType.indexOf('application/json') !== -1) {
                throw new Error('服务器返回了 JSON 元数据而非文件内容，请重试');
            }

            return await blobResponse.arrayBuffer();
        }

        async function downloadAndMergeFile(fileInfo) {
            const storedChunks = fileInfo.storedChunks || [];
            const totalChunks = fileInfo.totalChunks || 1;
            const chunks = [];

            for (let i = 0; i < totalChunks; i++) {
                const storedName = storedChunks[i] || buildChunkStoredName(fileInfo, i);
                const chunkData = await downloadChunk(storedName);
                chunks.push(new Uint8Array(chunkData));
            }

            const totalSize = chunks.reduce((acc, chunk) => acc + chunk.length, 0);

            if (fileInfo.size != null && totalSize !== fileInfo.size) {
                throw new Error(`下载文件不完整: 预期 ${fileInfo.size} 字节，实际 ${totalSize} 字节`);
            }

            const mergedBuffer = new Uint8Array(totalSize);
            let offset = 0;
            for (const chunk of chunks) {
                mergedBuffer.set(chunk, offset);
                offset += chunk.length;
            }

            return mergedBuffer;
        }

        async function uploadFileToRepo(file, version, onPhase) {
            if (file.size <= CHUNK_SIZE) {
                const apiKey = decodeApiKey();
                if (!apiKey) throw new Error("API Key解码失败");

                const baseName = file.name.replace(/\.[^/.]+$/, '');
                const storedName = `v${version}_${baseName}.bin`;
                const filePath = `files/${encodeURIComponent(storedName)}`;
                const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${filePath}`;

                const arrayBuffer = await file.arrayBuffer();
                const base64Content = arrayBufferToBase64(arrayBuffer);

                let sha = null;
                try {
                    const existingResponse = await fetch(url, {
                        headers: {
                            'Authorization': `token ${apiKey}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    if (existingResponse.ok) {
                        const data = await existingResponse.json();
                        sha = data.sha;
                    }
                } catch (e) {}

                const requestBody = {
                    message: `上传文件: ${storedName}`,
                    content: base64Content
                };
                if (sha) requestBody.sha = sha;

                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`上传文件失败: ${response.status} - ${errorText}`);
                }

                if (onPhase) onPhase({ type: 'transfer', bytes: file.size });
                if (onPhase) onPhase({ type: 'verify' });
                await verifyChunkOnServer(storedName, file.size, arrayBuffer);
                if (onPhase) onPhase({ type: 'verified', bytes: file.size });

                return {
                    originalName: file.name,
                    size: file.size,
                    totalChunks: 1,
                    chunkSize: file.size,
                    uploadedAt: new Date().toISOString(),
                    storedChunks: [storedName]
                };
            } else {
                return await uploadFileInChunks(file, version, onPhase);
            }
        }

        async function getUploadStats() {
            const apiKey = decodeApiKey();
            if (!apiKey) throw new Error("API Key解码失败");

            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/upload_stats.yaml`;

            try {
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `token ${apiKey}`,
                        'Accept': 'application/vnd.github.v3.raw'
                    }
                });

                if (response.status === 404) {
                    return {};
                }

                if (!response.ok) throw new Error(`获取上传统计失败: ${response.status}`);

                const content = await response.text();
                return jsyaml.load(content) || {};
            } catch (error) {
                return {};
            }
        }

        async function saveUploadStats(stats) {
            const apiKey = decodeApiKey();
            if (!apiKey) throw new Error("API Key解码失败");

            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/upload_stats.yaml`;

            let sha = null;
            try {
                const existingResponse = await fetch(url, {
                    headers: {
                        'Authorization': `token ${apiKey}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                if (existingResponse.ok) {
                    const data = await existingResponse.json();
                    sha = data.sha;
                }
            } catch (e) {}

            const content = jsyaml.dump(stats);
            const base64Content = base64Encode(content);

            const requestBody = {
                message: "更新上传统计",
                content: base64Content
            };
            if (sha) requestBody.sha = sha;

            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) throw new Error(`保存上传统计失败: ${response.status}`);
            return await response.json();
        }

        async function checkUploadLimit() {
            const stats = await getUploadStats();
            const today = new Date().toISOString().split('T')[0];

            if (!stats[currentUser.username]) {
                stats[currentUser.username] = {};
            }

            if (stats[currentUser.username][today]) {
                if (stats[currentUser.username][today] >= DAILY_UPLOAD_LIMIT) {
                    throw new Error(`今日上传次数已达上限（${DAILY_UPLOAD_LIMIT}次），请明天再试`);
                }
            }

            return stats;
        }

        async function handleFiles(files) {
            if (!currentUser) {
                showFeedbackStatus('uploadStatus', '请先登录', 'error');
                return;
            }

            const uploadBtn = document.querySelector('.upload-btn');
            uploadBtn.disabled = true;

            const progressWrap = document.getElementById('uploadProgressWrap');
            const progressName = document.getElementById('uploadProgressName');
            const progressBar = document.getElementById('uploadProgressBar');
            const progressText = document.getElementById('uploadProgressText');

            try {
                for (const file of files) {
                    if (file.size > MAX_FILE_SIZE) {
                        showFeedbackStatus('uploadStatus', `文件 ${file.name} 超过大小限制（最大1024MB）`, 'error');
                        uploadBtn.disabled = false;
                        return;
                    }
                }

                const stats = await checkUploadLimit();

                showFeedbackStatus('uploadStatus', '上传中...', 'info');

                const version = await getNextVersion();
                const today = new Date().toISOString().split('T')[0];

                const currentFiles = await getFilesList();
                const newFiles = [];

                const fileArray = Array.from(files);
                const totalDenom = fileArray.reduce((acc, f) => acc + Math.max(f.size, 1), 0);
                let doneBytes = 0;
                let verifiedBytes = 0;

                progressWrap.style.display = 'block';
                progressBar.style.width = '0%';
                progressText.textContent = '准备上传...';

                const updateProgress = (label) => {
                    const transfer = (doneBytes / totalDenom) * 90;
                    const verify = (verifiedBytes / totalDenom) * 10;
                    const pct = Math.min(100, transfer + verify);
                    progressBar.style.width = pct + '%';
                    progressText.textContent = label || Math.floor(pct) + '%';
                };

                for (const file of fileArray) {
                    progressName.textContent = file.name;
                    const fileInfo = await uploadFileToRepo(file, version, (phase) => {
                        if (phase.type === 'transfer') {
                            doneBytes += Math.max(phase.bytes, 1);
                            updateProgress();
                        } else if (phase.type === 'verify') {
                            updateProgress('上传完成，正在验证服务器上的文件...');
                        } else if (phase.type === 'verified') {
                            verifiedBytes += Math.max(phase.bytes, 1);
                            updateProgress();
                        }
                    });

                    newFiles.push({
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                        username: currentUser.username,
                        fileName: file.name,
                        version: version,
                        size: file.size,
                        totalChunks: fileInfo.totalChunks,
                        chunkSize: fileInfo.chunkSize,
                        uploadedAt: new Date().toISOString(),
                        storedChunks: fileInfo.storedChunks
                    });

                    if (!stats[currentUser.username]) {
                        stats[currentUser.username] = {};
                    }
                    stats[currentUser.username][today] = (stats[currentUser.username][today] || 0) + 1;
                }

                const updatedFiles = [...currentFiles, ...newFiles];
                await saveFilesList(updatedFiles);
                await saveVersion(version);
                await saveUploadStats(stats);

                progressBar.style.width = '100%';
                progressText.textContent = '上传完成，文件已确认存在于服务器';

                await refreshFileList();

                const remaining = DAILY_UPLOAD_LIMIT - (stats[currentUser.username][today] || 0);
                showFeedbackStatus('uploadStatus', `上传成功！版本: v${version}，今日剩余上传次数: ${remaining}`, 'success');

            } catch (error) {
                console.error('上传失败:', error);
                progressText.textContent = '上传失败: ' + error.message;
                showFeedbackStatus('uploadStatus', '上传失败: ' + error.message, 'error');
            } finally {
                uploadBtn.disabled = false;
            }
        }

        async function handleRefresh() {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.classList.add('loading');
            refreshBtn.disabled = true;

            try {
                await refreshFileList();
                showFeedbackStatus('uploadStatus', '刷新成功', 'success');
            } catch (error) {
                console.error('刷新失败:', error);
                showFeedbackStatus('uploadStatus', '刷新失败: ' + error.message, 'error');
            } finally {
                refreshBtn.classList.remove('loading');
                refreshBtn.disabled = false;
            }
        }

        async function refreshFileList() {
            const fileListContent = document.getElementById('fileListContent');
            const fileCount = document.getElementById('fileCount');

            try {
                const files = await getMyFiles();

                if (files.length === 0) {
                    fileListContent.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-folder-open"></i>
                            <p>暂无文件，上传一些文件开始使用</p>
                        </div>
                    `;
                    fileCount.textContent = '0 个文件';
                    return;
                }

                fileCount.textContent = `${files.length} 个文件`;

                fileListContent.innerHTML = files.map(file => `
                    <div class="file-item">
                        <div class="file-info">
                            <div class="file-name">${escapeHtml(file.fileName)}</div>
                            <div class="file-meta">
                                上传者: ${escapeHtml(file.username)} | 版本: v${file.version} | 大小: ${formatFileSize(file.size)}
                            </div>
                        </div>
                        <div class="file-actions">
                            <button class="file-action-btn download-btn" onclick="downloadFile('${jsString(file.id)}')">
                                <i class="fas fa-download"></i> 下载
                            </button>
                            <button class="file-action-btn delete-btn" onclick="deleteFile('${jsString(file.id)}')">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('刷新文件列表失败:', error);
                fileListContent.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>加载文件列表失败</p>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function downloadFile(fileId) {
            const files = await getMyFiles();
            const fileInfo = files.find(f => f.id === fileId);

            if (!fileInfo) {
                showFeedbackStatus('uploadStatus', '文件不存在或无权下载', 'error');
                return;
            }

            const fileName = fileInfo.fileName;
            const version = fileInfo.version;

            const downloadBtn = document.createElement('a');
            downloadBtn.className = 'btn';
            downloadBtn.style.cssText = 'display: none;';
            document.body.appendChild(downloadBtn);

            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.innerHTML = `
                <div class="modal-content" style="max-width: 400px;">
                    <div class="modal-header">
                        <h2>下载 ${escapeHtml(fileName)}</h2>
                        <button class="modal-close" onclick="this.closest('.modal').remove(); document.body.style.overflow='auto';">&times;</button>
                    </div>
                    <div style="text-align: center; padding: 20px 0;">
                        <p style="margin-bottom: 20px; color: var(--gray);">版本: v${version}</p>
                        <div id="downloadProgress" style="display: none;">
                            <div style="margin-bottom: 10px;">下载进度: <span id="progressText">0%</span></div>
                            <div style="width: 100%; height: 20px; background: #eee; border-radius: 10px; overflow: hidden;">
                                <div id="progressBar" style="width: 0%; height: 100%; background: var(--primary); transition: width 0.3s;"></div>
                            </div>
                        </div>
                        <button id="startDownload" class="btn" style="display: block; margin: 0 auto 15px; background-color: var(--primary);">
                            <i class="fas fa-download"></i> 开始下载
                        </button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.remove();
                    document.body.style.overflow = 'auto';
                    downloadBtn.remove();
                }
            });

            document.getElementById('startDownload').addEventListener('click', async () => {
                const startBtn = document.getElementById('startDownload');
                const progressDiv = document.getElementById('downloadProgress');
                const progressText = document.getElementById('progressText');
                const progressBar = document.getElementById('progressBar');

                startBtn.style.display = 'none';
                progressDiv.style.display = 'block';
                progressText.textContent = '0%';
                progressBar.style.width = '0%';

                try {
                    const mergedBuffer = await downloadAndMergeFile({
                        fileName: fileInfo.fileName,
                        totalChunks: fileInfo.totalChunks || 1,
                        version: version,
                        size: fileInfo.size,
                        storedChunks: fileInfo.storedChunks
                    });

                    const blob = new Blob([mergedBuffer]);
                    const url = URL.createObjectURL(blob);
                    downloadBtn.href = url;
                    downloadBtn.download = fileName;
                    downloadBtn.click();
                    URL.revokeObjectURL(url);

                    showFeedbackStatus('uploadStatus', '下载成功', 'success');
                } catch (error) {
                    console.error('下载失败:', error);
                    showFeedbackStatus('uploadStatus', '下载失败: ' + error.message, 'error');
                } finally {
                    modal.remove();
                    document.body.style.overflow = 'auto';
                    downloadBtn.remove();
                }
            });
        }

        async function deleteFile(fileId) {
            if (!currentUser) {
                showFeedbackStatus('uploadStatus', '请先登录', 'error');
                return;
            }

            if (!confirm('确定要删除这个文件吗？')) return;

            try {
                const files = await getMyFiles();
                const fileToDelete = files.find(f => f.id === fileId);

                if (!fileToDelete) {
                    showFeedbackStatus('uploadStatus', '文件不存在或无权删除', 'error');
                    return;
                }

                if (fileToDelete.username !== currentUser.username) {
                    showFeedbackStatus('uploadStatus', '只能删除自己上传的文件', 'error');
                    return;
                }

                const apiKey = decodeApiKey();
                const storedChunks = fileToDelete.storedChunks || [];
                const totalChunks = fileToDelete.totalChunks || 1;

                for (let i = 0; i < totalChunks; i++) {
                    const chunkFileName = storedChunks[i] || buildChunkStoredName(fileToDelete, i);
                    const filePath = `files/${encodeURIComponent(chunkFileName)}`;
                    const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${filePath}`;

                    let sha = null;
                    try {
                        const existingResponse = await fetch(url, {
                            headers: {
                                'Authorization': `token ${apiKey}`,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        });
                        if (existingResponse.ok) {
                            const data = await existingResponse.json();
                            sha = data.sha;
                        }
                    } catch (e) {}

                    if (sha) {
                        const response = await fetch(url, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `token ${apiKey}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `删除文件分片: ${chunkFileName}`,
                                sha: sha
                            })
                        });

                        if (!response.ok) {
                            console.warn(`删除分片 ${chunkFileName} 失败: ${response.status}`);
                        }
                    }
                }

                const allFiles = await getFilesList();
                const updatedFiles = allFiles.filter(f => f.id !== fileId);
                await saveFilesList(updatedFiles);

                await refreshFileList();
                showFeedbackStatus('uploadStatus', '删除成功', 'success');

            } catch (error) {
                console.error('删除失败:', error);
                showFeedbackStatus('uploadStatus', '删除失败: ' + error.message, 'error');
            }
        }
    </script>
